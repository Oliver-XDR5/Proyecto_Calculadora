    <meta charset="UTF-8">

    <script src="codigo.js"></script>

</head>
<body>
    <nav class="navbar navbar-expand-lg bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="imagenes para proyecto/Calculadora principal.png" alt="Logo de calculadora" width="25px" height="25px">
                <span>Matemáticas</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Calculadora</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sumas.html">Suma</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="restas.html">Resta</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="multiplicacion.html">Multiplicaciones</a>

                    <li class="nav-item">
                        <a class="nav-link" href="division.html">Divisiones</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <br>
    <h1 class="Titulo_h1">Calculadora</h1>
    <br>
    <br>
    <div class="Div_principal">
        <div class="input1"><input type="text" id="Pantalla" readonly></div>
        <br>
        <div class="Div_caja1">
            <button class="Eliminar1" onclick="Eliminar()">CE</button>
            <button class="Eliminar2" onclick="Eliminar()">C</button>
            <button class="Borrar" onclick="Borrar()"><img class="Imagen_borrar" src="imagenes para proyecto/Borrar Calculadora.png" alt="Borrador de calculadora" width="20px" height="25px"></button>
            <button class="Dividir" onclick="Agregar('/')">÷</button>
        </div>
        <br>
        <Div class="Div_caja2">
            <button class="Siete" onclick="Agregar(7)">7</button>
            <button class="Ocho" onclick="Agregar(8)">8</button>
            <button class="Nueve" onclick="Agregar(9)">9</button>
            <button class="Multiplicar" onclick="Agregar('*')">x</button>
        </Div>
        <br>
        <div class="Div_caja3">
            <button class="Cuatro" onclick="Agregar(4)">4</button>
            <button class="Cinco" onclick="Agregar(5)">5</button>
            <button class="Seis" onclick="Agregar(6)">6</button>
            <button class="Restar" onclick="Agregar('-')">-</button>
        </div>
        <br>
        <div class="Div_caja4">
            <button class="Uno" onclick="Agregar(1)">1</button>
            <button class="Dos" onclick="Agregar(2)">2</button>
            <button class="Tres" onclick="Agregar(3)">3</button>
            <button class="Sumar" onclick="Agregar('+')">+</button>
        </div>
        <br>
        <div class="Div_caja5">
            <button class="Porcentaje" onclick="Agregar('%')">%</button>
            <button class="Cero" onclick="Agregar(0)">0</button>
            <button class="Punto" onclick="Agregar('.')">.</button>
            <button class="Calcular" onclick="Calcular()">=</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
